[workspace]
resolver = "3"
members = [
    "crates/copper-asx-gates",
    "crates/copper-asx-profile",
    "crates/copper-asx-z3",
    "crates/copper-asx-pillars", "crates/copper-asx-mcp-z3", "crates/copper-asx-soft-delete",
]

[workspace.package]
version = "0.6.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/copper-browser/copper-linux"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 1
